[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorc"
version = "0.16.0"
description = "Neural network framework in C11 with autograd, callable from Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
license = { text = "Apache-2.0" }
authors = [{ name = "Carlos Guedea" }]
keywords = ["neural-network", "autograd", "conv2d", "c11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
packages = ["tensorc"]

[tool.setuptools.package-data]
tensorc = ["*.pyi"]

[tool.cibuildwheel]
# CPython 3.9–3.13 en todas las plataformas; sin PyPy ni musl.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686 pp*"
# Prueba de humo en cada rueda: importar, matmul y backward básicos.
test-command = "python -c \"import tensorc; x = tensorc.Tensor([1.0, 2.0, 3.0, 4.0], shape=(2, 2), requires_grad=True); w = tensorc.Tensor([1, 0, 0, 1], shape=(2, 2)); loss = x.matmul(w).relu().sum(); loss.backward(); assert len(x.grad) == 4; print('wheel OK', tensorc.__version__)\""
