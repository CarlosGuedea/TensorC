# Genera ruedas (wheels) multiplataforma del paquete Python y las publica
# en PyPI. Se dispara al etiquetar (v*); el despacho manual solo construye
# y sube artefactos, sin publicar.
name: Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            archs: "x86_64 arm64"
          - os: ubuntu-latest
            archs: "x86_64 aarch64"
          - os: windows-latest
            archs: "AMD64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # aarch64 en Linux se emula con QEMU.
      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux' && contains(matrix.archs, 'aarch64')
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        with:
          package-dir: python
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # No falla si algún archivo ya existe (p. ej. la rueda macOS
          # subida a mano antes de tener este flujo).
          skip-existing: true
