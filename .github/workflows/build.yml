name: Build

on:
  push:
  pull_request:

jobs:
  cmake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run XOR example
        run: ./build/tensorc_xor
        if: runner.os != 'Windows'
      - name: Run autodiff example
        run: ./build/tensorc_autograd
        if: runner.os != 'Windows'
      - name: Run XOR example (Windows)
        run: .\build\Release\tensorc_xor.exe
        if: runner.os == 'Windows'
      - name: Run autodiff example (Windows)
        run: .\build\Release\tensorc_autograd.exe
        if: runner.os == 'Windows'
